[package]
name = "jellyfin-sdk-rs"
version = "0.1.0"
edition = "2024"
authors = ["leuchthelp"]
description = "jellyfin rust sdk"
readme = "README.md"
repository = "https://github.com/leuchthelp/jellyfin-sdk-rs"
license-file = "LICENSE"

[features]
default = []
with_bon = ["dep:bon"]

[dependencies]
jellyfin-generated-client = { path = "generated-client" }
reqwest = { version = "0.13", features = ["json"] }
url = "2"
thiserror = "2"
uuid = { version = "1", features = ["zerocopy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

bon = { version = "3", optional = true }
